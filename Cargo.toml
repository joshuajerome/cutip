[package]
name = "cutip_core"
version = "0.1.0"
edition = "2021"
description = "Workflow automation framework — Rust core for cutip Python package"
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
anyhow = "1"
