name: E2E — Docker

on:
  push:
    # ── Branch triggers ─────────────────────────────────────────────────────
    # To add more branch patterns in the future, append them to this list.
    # Glob syntax is supported (e.g. "release/**", "feature/**").
    # ────────────────────────────────────────────────────────────────────────
    branches:
      - main
      - "gh/**"        # workflow / CI / runner branches
  pull_request:

jobs:
  e2e-docker:
    name: Docker E2E · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macOS is intentionally excluded: GitHub's shared macOS runners do not
        # grant the com.apple.vm.hypervisor entitlement required by Apple's
        # Virtualization Framework (VZ/vfkit).  Both Colima and Docker Desktop
        # rely on VZ on Apple Silicon, so any VM-based Docker setup fails with
        # "vfkit exited unexpectedly".  Run macOS E2E locally or on a
        # self-hosted macOS runner where the entitlement is available.
        os: [ubuntu-latest, windows-latest]

    # Force UTF-8 for all Python I/O so that Unicode log output (arrows,
    # checkmarks, etc.) does not crash the cp1252 console on Windows.
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install cutip with Docker extra
        run: |
          uv venv .venv
          uv pip install -e ".[docker]"

      # ── Platform: Ubuntu ─────────────────────────────────────────────────
      # Docker Engine is pre-installed on GitHub-hosted ubuntu-latest runners.
      - name: Verify Docker (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          docker version
          docker info
          echo "CUTIP_BACKEND_NAME=docker" >> "$GITHUB_ENV"

      # ── Platform: Windows ────────────────────────────────────────────────
      # Docker Engine ships with windows-latest GitHub-hosted runners.
      - name: Verify Docker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          docker version
          docker info
          "CUTIP_BACKEND_NAME=docker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ── Validate the CUTIP workspace ─────────────────────────────────────
      - name: Validate hello-world workspace
        run: uv run cutip validate --path tests/e2e/hello-world

      # ── Run end-to-end test ──────────────────────────────────────────────
      - name: Run E2E group (Docker · ${{ matrix.os }})
        run: uv run cutip run hello --path tests/e2e/hello-world --backend docker
