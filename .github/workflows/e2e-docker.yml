name: E2E — Docker

on:
  push:
    # ── Branch triggers ─────────────────────────────────────────────────────
    # To add more branch patterns in the future, append them to this list.
    # Glob syntax is supported (e.g. "release/**", "feature/**").
    # ────────────────────────────────────────────────────────────────────────
    branches:
      - main
      - "gh/**"        # workflow / CI / runner branches
      - dev/**
  pull_request:

jobs:
  e2e-docker:
    name: Docker E2E · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macOS excluded: GitHub shared macOS runners lack the
        # com.apple.vm.hypervisor entitlement that VZ/vfkit requires; Colima
        # fails with "vfkit exited unexpectedly".  Run locally or on a
        # self-hosted macOS runner.
        #
        # Windows excluded: GitHub windows-latest (Windows Server 2025) runs
        # Docker Engine in Windows containers mode by default.  Linux images
        # like alpine have no Windows manifest variant, so pulls fail with
        # "no matching manifest for windows/amd64".  Switching to Linux
        # containers requires Docker Desktop's DockerCli.exe, which is absent
        # on the server runner image.  The Ubuntu job fully validates the Docker
        # backend; Windows-specific code paths are covered by the Podman E2E.
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install cutip with Docker extra
        run: |
          uv venv .venv
          uv pip install -e ".[docker]"

      # Docker Engine is pre-installed on GitHub-hosted ubuntu-latest runners.
      - name: Verify Docker
        run: |
          docker version
          docker info
          echo "CUTIP_BACKEND_NAME=docker" >> "$GITHUB_ENV"

      # ── Validate the CUTIP workspace ─────────────────────────────────────
      - name: Validate hello-world workspace
        run: uv run cutip validate --path tests/e2e/hello-world

      # ── Run end-to-end test ──────────────────────────────────────────────
      - name: Run E2E group (Docker · Ubuntu)
        run: uv run cutip run hello --path tests/e2e/hello-world --backend docker
