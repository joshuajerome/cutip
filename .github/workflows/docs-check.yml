name: Docs Check

on:
  push:
    branches:
      - "docs/**"
  pull_request:
    branches:
      - staging
      - integration
    paths:
      - "docs/**"
      - "mkdocs.yml"

# Required for mkdocs gh-deploy to push to the gh-pages branch
permissions:
  contents: write

jobs:
  docs:
    name: MkDocs · Build${{ (github.event_name == 'push' && github.ref == 'refs/heads/integration') && ' & Deploy' || '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required for mkdocs gh-deploy
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install docs dependencies
        run: |
          uv venv .venv
          uv pip install -e ".[docs]"

      - name: Build docs (strict — fails on any warning)
        run: uv run mkdocs build --strict

      # Deploy only on push to integration AND when the repo is public.
      - name: Deploy to GitHub Pages
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/integration' &&
          !github.event.repository.private
        run: uv run mkdocs gh-deploy --force
