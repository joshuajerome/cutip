name: Release

on:
  push:
    branches:
      - "release/**"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/e2e -v --tb=short

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke-test wheel install
        run: |
          uv venv .wheel-test
          uv pip install --python .wheel-test/bin/python dist/cutip-*.whl
          .wheel-test/bin/python -c "import cutip; print('cutip import OK')"
          .wheel-test/bin/cutip --help

  e2e-podman-ubuntu:
    name: E2E Podman · Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install cutip
        run: |
          uv venv .venv
          uv pip install -e .

      - name: Install & start Podman (Ubuntu)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends podman
          systemctl --user start podman.socket
          echo "CONTAINER_HOST=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_ENV"
          echo "CUTIP_BACKEND_NAME=podman" >> "$GITHUB_ENV"
          podman version

      - name: Validate simple workspace
        run: uv run cutip validate --path tests/e2e/simple

      - name: Run E2E group simple (Podman · Ubuntu)
        run: uv run cutip run simple --path tests/e2e/simple --local

      - name: Validate complex workspace
        run: uv run cutip validate --path tests/e2e/complex

      - name: Run E2E group complex (Podman · Ubuntu)
        run: uv run cutip run complex --path tests/e2e/complex --local

  e2e-podman-windows:
    name: E2E Podman · Windows
    runs-on: windows-latest
    timeout-minutes: 35

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install cutip
        run: |
          uv venv .venv
          uv pip install -e .

      - name: Install Podman (Windows)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "token $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod "https://api.github.com/repos/containers/podman/releases/latest" -Headers $headers
          $version  = $release.tag_name.TrimStart('v')
          $url      = "https://github.com/containers/podman/releases/download/v${version}/podman-${version}-setup.exe"
          Write-Host "Downloading Podman $version from $url"
          Invoke-WebRequest -Uri $url -OutFile "podman-setup.exe"
          Start-Process -Wait -FilePath ".\podman-setup.exe" -ArgumentList "/S"
          $podmanPath = "C:\Program Files\RedHat\Podman"
          echo "$podmanPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CUTIP_BACKEND_NAME=podman" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$podmanPath\podman.exe" --version

      - name: Start Podman machine (Windows)
        shell: pwsh
        run: |
          podman machine init --cpus 2 --memory 2048 --now
          podman version

      - name: Validate simple workspace
        run: uv run cutip validate --path tests/e2e/simple

      - name: Run E2E group simple (Podman · Windows)
        run: uv run cutip run simple --path tests/e2e/simple

      - name: Validate complex workspace
        run: uv run cutip validate --path tests/e2e/complex

      - name: Run E2E group complex (Podman · Windows)
        run: uv run cutip run complex --path tests/e2e/complex

  install-validate-macos:
    # GitHub Actions free macOS runners report VZErrorDomain Code=2
    # ("Virtualization is not available on this hardware") — the Apple
    # Hypervisor Framework is not exposed to runner processes, so podman machine
    # cannot start. Container runtime E2E is tested locally on a developer Mac
    # or via a self-hosted runner. This job validates install + schema only.
    name: Install & Validate · macOS
    runs-on: macos-14
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install cutip
        run: |
          uv venv .venv
          uv pip install -e .

      - name: Smoke-test CLI (no runtime needed)
        run: |
          uv run cutip --help
          uv run cutip --version

      - name: Validate simple workspace (schema only, no containers)
        run: uv run cutip validate --path tests/e2e/simple

      - name: Validate complex workspace (schema only, no containers)
        run: uv run cutip validate --path tests/e2e/complex

  build-and-release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    needs: [unit-tests, smoke-test, e2e-podman-ubuntu, e2e-podman-windows, install-validate-macos]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${GITHUB_REF#refs/heads/release/}"
          VERSION="${BRANCH#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build wheel + sdist
        run: uv build

      - name: List dist/
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: cutip ${{ steps.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true

      # Publish to PyPI — gated by PUBLISH_TO_PYPI secret (set to "true" to enable)
      - name: Publish to PyPI
        if: vars.PUBLISH_TO_PYPI == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
