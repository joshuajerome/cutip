name: Release CLI

on:
  pull_request:
    types: [closed]
    branches:
      - integration

jobs:
  build-cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release/')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        run: |
          pip install maturin
          cp pyproject.toml pyproject-python.toml
          cp pyproject-rs.toml pyproject.toml
          maturin build --release --target ${{ matrix.target }}
          cp pyproject-python.toml pyproject.toml

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: target/wheels/*.whl

  publish-cli:
    name: Publish CLI
    needs: build-cli
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release/')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/

      - name: Publish to PyPI
        if: vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
