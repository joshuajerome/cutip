name: PR Checks

on:
  pull_request:
    branches:
      - staging
      - integration

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/e2e -v --tb=short

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke-test wheel install
        run: |
          uv venv .wheel-test
          uv pip install --python .wheel-test/bin/python dist/cutip-*.whl
          .wheel-test/bin/python -c "import cutip; print('cutip import OK')"
          .wheel-test/bin/cutip --help

  e2e-podman-ubuntu:
    name: E2E Podman · Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install cutip
        run: |
          uv venv .venv
          uv pip install -e .

      - name: Install & start Podman (Ubuntu)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends podman
          systemctl --user start podman.socket
          echo "CONTAINER_HOST=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_ENV"
          echo "CUTIP_BACKEND_NAME=podman" >> "$GITHUB_ENV"
          podman version

      - name: Validate hello-world workspace
        run: uv run cutip validate --path tests/e2e/hello-world

      - name: Run E2E group (Podman · Ubuntu)
        run: uv run cutip run hello --path tests/e2e/hello-world --local

  e2e-podman-windows:
    name: E2E Podman · Windows
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install cutip
        run: |
          uv venv .venv
          uv pip install -e .

      - name: Install Podman (Windows)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "token $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod "https://api.github.com/repos/containers/podman/releases/latest" -Headers $headers
          $version  = $release.tag_name.TrimStart('v')
          $url      = "https://github.com/containers/podman/releases/download/v${version}/podman-${version}-setup.exe"
          Write-Host "Downloading Podman $version from $url"
          Invoke-WebRequest -Uri $url -OutFile "podman-setup.exe"
          Start-Process -Wait -FilePath ".\podman-setup.exe" -ArgumentList "/S"
          $podmanPath = "C:\Program Files\RedHat\Podman"
          echo "$podmanPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CUTIP_BACKEND_NAME=podman" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$podmanPath\podman.exe" --version

      - name: Start Podman machine (Windows)
        shell: pwsh
        run: |
          podman machine init --cpus 2 --memory 2048 --now
          podman version

      - name: Validate hello-world workspace
        run: uv run cutip validate --path tests/e2e/hello-world

      - name: Run E2E group (Podman · Windows)
        run: uv run cutip run hello --path tests/e2e/hello-world

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install docs dependencies
        run: |
          uv venv .venv
          uv pip install -e ".[docs]"

      - name: Build docs (strict)
        run: uv run mkdocs build --strict
