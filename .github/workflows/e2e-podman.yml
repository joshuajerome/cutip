name: E2E — Podman

on:
  push:
    # ── Branch triggers ─────────────────────────────────────────────────────
    # To add more branch patterns in the future, append them to this list.
    # Glob syntax is supported (e.g. "release/**", "feature/**").
    # ────────────────────────────────────────────────────────────────────────
    branches:
      - main
      - "gh/**"        # workflow / CI / runner branches
  pull_request:

jobs:
  e2e-podman:
    name: Podman E2E · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macOS is intentionally excluded: GitHub's shared macOS runners do not
        # grant the com.apple.vm.hypervisor entitlement required by Apple's
        # Virtualization Framework (VZ/vfkit).  Podman machine on Apple Silicon
        # uses VZ by default and fails with "vfkit exited unexpectedly" when
        # that entitlement is missing.  Run macOS E2E locally or on a
        # self-hosted macOS runner where the entitlement is available.
        os: [ubuntu-latest, windows-latest]

    # Force UTF-8 for all Python I/O so that Unicode log output (arrows,
    # checkmarks, etc.) does not crash the cp1252 console on Windows.
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install cutip with Podman extra
        run: |
          uv venv .venv
          uv pip install -e ".[podman]"

      # ── Platform: Ubuntu ─────────────────────────────────────────────────
      - name: Install & start Podman (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends podman

          # Start the rootless user socket
          systemctl --user start podman.socket

          # Export CONTAINER_HOST so connect_local() finds the socket
          echo "CONTAINER_HOST=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_ENV"
          echo "CUTIP_BACKEND_NAME=podman" >> "$GITHUB_ENV"

          podman version

      # ── Platform: Windows ────────────────────────────────────────────────
      - name: Install Podman (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Fetch the latest Podman release and install silently
          $release = Invoke-RestMethod "https://api.github.com/repos/containers/podman/releases/latest"
          $version  = $release.tag_name.TrimStart('v')
          $url      = "https://github.com/containers/podman/releases/download/v${version}/podman-${version}-setup.exe"

          Write-Host "Downloading Podman $version from $url"
          Invoke-WebRequest -Uri $url -OutFile "podman-setup.exe"
          Start-Process -Wait -FilePath ".\podman-setup.exe" -ArgumentList "/S"

          # Add Podman to PATH for subsequent steps
          $podmanPath = "C:\Program Files\RedHat\Podman"
          echo "$podmanPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          echo "CUTIP_BACKEND_NAME=podman" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Print the client binary version only (no --client flag; use --format instead).
          # The socket/machine is not up yet so we can't do a full `podman version`.
          & "$podmanPath\podman.exe" --version

      - name: Start Podman machine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          podman machine init --cpus 2 --memory 2048 --now

          # Confirm the full daemon connection works now that the machine is up
          podman version
          # Note: we do NOT set CONTAINER_HOST to npipe:// here.
          # podman-py does not support Windows named pipes.  The Windows E2E
          # run step (below) uses the SSH-tunnel mode instead of --local.

      # ── Validate the CUTIP workspace ─────────────────────────────────────
      - name: Validate hello-world workspace
        run: uv run cutip validate --path tests/e2e/hello-world

      # ── Run end-to-end test ──────────────────────────────────────────────
      # Ubuntu: use --local (direct Unix socket via CONTAINER_HOST).
      - name: Run E2E group (Podman · Ubuntu)
        if: runner.os == 'Linux'
        run: uv run cutip run hello --path tests/e2e/hello-world --backend podman --local

      # Windows: podman-py does not support named pipes, so we use the
      # SSH-tunnel mode (no --local).  PodmanBackend.connect() reads
      # `podman system connection ls`, opens an SSH tunnel to the Podman
      # machine, and exposes the socket on tcp://localhost:<port> — the same
      # flow a Windows developer uses when not specifying --local.
      - name: Run E2E group (Podman · Windows)
        if: runner.os == 'Windows'
        run: uv run cutip run hello --path tests/e2e/hello-world --backend podman
