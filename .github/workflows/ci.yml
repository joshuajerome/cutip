name: CI

on:
  push:
    branches:
      - "feat/**"
      - "bug/**"
      - "claude/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - staging
      - integration

jobs:
  # ── Auto-label and assign on PR open ────────────────────────────────────────
  auto-label:
    name: Label & Assign PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'

    permissions:
      pull-requests: write

    steps:
      - name: Apply label and assignee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          BRANCH="${{ github.head_ref }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          # Assign to PR author
          gh pr edit "$PR" --repo "${{ github.repository }}" --add-assignee "$AUTHOR"

          # Derive label from branch prefix
          if echo "$BRANCH" | grep -qE '^feat/'; then
            LABEL="feature"
            COLOR="0075ca"
            DESC="New feature or capability"
          elif echo "$BRANCH" | grep -qE '^bug/'; then
            LABEL="bugfix"
            COLOR="d73a4a"
            DESC="Bug fix"
          elif echo "$BRANCH" | grep -qE '^docs/'; then
            LABEL="documentation"
            COLOR="006b75"
            DESC="Documentation update"
          elif echo "$BRANCH" | grep -qE '^(gh|claude)/'; then
            LABEL="automation"
            COLOR="e4e669"
            DESC="CI/CD or automation change"
          else
            LABEL="feature"
            COLOR="0075ca"
            DESC="New feature or capability"
          fi

          gh label create "$LABEL" --color "$COLOR" --description "$DESC" \
            --force --repo "${{ github.repository }}" 2>/dev/null || true
          gh pr edit "$PR" --repo "${{ github.repository }}" --add-label "$LABEL"

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/e2e -v --tb=short

  # ── Smoke Test ──────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke-test wheel install
        run: |
          uv venv .wheel-test
          uv pip install --python .wheel-test/bin/python dist/cutip-*.whl
          .wheel-test/bin/python -c "import cutip; print('cutip import OK')"
          .wheel-test/bin/cutip --help

  # ── E2E · Ubuntu ────────────────────────────────────────────────────────────
  e2e-podman-ubuntu:
    name: E2E Podman · Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install cutip
        run: |
          uv venv .venv
          uv pip install -e .

      - name: Install & start Podman (Ubuntu)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends podman
          systemctl --user start podman.socket
          echo "CONTAINER_HOST=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_ENV"
          echo "CUTIP_BACKEND_NAME=podman" >> "$GITHUB_ENV"
          podman version

      - name: Validate simple workspace
        run: uv run cutip validate --path tests/e2e/simple

      - name: Run E2E group simple (Podman · Ubuntu)
        run: uv run cutip run simple --path tests/e2e/simple --backend podman --local

      - name: Validate complex workspace
        run: uv run cutip validate --path tests/e2e/complex

      - name: Run E2E group complex (Podman · Ubuntu)
        run: uv run cutip run complex --path tests/e2e/complex --backend podman --local

      # ── from-compose: awesome-compose validation suite ──────────────────────
      - name: "from-compose · react-nginx"
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/awesome-compose/master/react-nginx/compose.yaml \
            -o /tmp/react-nginx.yaml
          mkdir -p /tmp/fc-react-nginx
          uv run cutip from-compose /tmp/react-nginx.yaml --output-dir /tmp/fc-react-nginx
          uv run cutip validate --path /tmp/fc-react-nginx

      - name: "from-compose · fastapi"
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/awesome-compose/master/fastapi/compose.yaml \
            -o /tmp/fastapi.yaml
          mkdir -p /tmp/fc-fastapi
          uv run cutip from-compose /tmp/fastapi.yaml --output-dir /tmp/fc-fastapi
          uv run cutip validate --path /tmp/fc-fastapi

      - name: "from-compose · nginx-flask-mongo"
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/awesome-compose/master/nginx-flask-mongo/compose.yaml \
            -o /tmp/nginx-flask-mongo.yaml
          mkdir -p /tmp/fc-nginx-flask-mongo
          uv run cutip from-compose /tmp/nginx-flask-mongo.yaml --output-dir /tmp/fc-nginx-flask-mongo
          uv run cutip validate --path /tmp/fc-nginx-flask-mongo

      - name: "from-compose · prometheus-grafana"
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/awesome-compose/master/prometheus-grafana/compose.yaml \
            -o /tmp/prometheus-grafana.yaml
          mkdir -p /tmp/fc-prometheus-grafana
          uv run cutip from-compose /tmp/prometheus-grafana.yaml --output-dir /tmp/fc-prometheus-grafana
          uv run cutip validate --path /tmp/fc-prometheus-grafana

      - name: "from-compose · angular"
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/awesome-compose/master/angular/compose.yaml \
            -o /tmp/angular.yaml
          mkdir -p /tmp/fc-angular
          uv run cutip from-compose /tmp/angular.yaml --output-dir /tmp/fc-angular
          uv run cutip validate --path /tmp/fc-angular

  # ── E2E · Docker · Ubuntu ──────────────────────────────────────────────────
  e2e-docker-ubuntu:
    name: E2E Docker · Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install cutip with docker extra
        run: |
          uv venv .venv
          uv pip install -e ".[docker]"

      - name: Verify Docker is available
        run: docker version

      - name: Validate simple workspace
        run: uv run cutip validate --path tests/e2e/simple

      - name: Run E2E group simple (Docker · Ubuntu)
        run: uv run cutip run simple --path tests/e2e/simple --backend docker --local

      - name: Validate complex workspace
        run: uv run cutip validate --path tests/e2e/complex

      - name: Run E2E group complex (Docker · Ubuntu)
        run: uv run cutip run complex --path tests/e2e/complex --backend docker --local

      # ── from-compose: awesome-compose validation suite ──────────────────────
      - name: "from-compose · react-nginx"
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/awesome-compose/master/react-nginx/compose.yaml \
            -o /tmp/react-nginx.yaml
          mkdir -p /tmp/fc-react-nginx
          uv run cutip from-compose /tmp/react-nginx.yaml --output-dir /tmp/fc-react-nginx
          uv run cutip validate --path /tmp/fc-react-nginx

      - name: "from-compose · fastapi"
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/awesome-compose/master/fastapi/compose.yaml \
            -o /tmp/fastapi.yaml
          mkdir -p /tmp/fc-fastapi
          uv run cutip from-compose /tmp/fastapi.yaml --output-dir /tmp/fc-fastapi
          uv run cutip validate --path /tmp/fc-fastapi

      - name: "from-compose · nginx-flask-mongo"
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/awesome-compose/master/nginx-flask-mongo/compose.yaml \
            -o /tmp/nginx-flask-mongo.yaml
          mkdir -p /tmp/fc-nginx-flask-mongo
          uv run cutip from-compose /tmp/nginx-flask-mongo.yaml --output-dir /tmp/fc-nginx-flask-mongo
          uv run cutip validate --path /tmp/fc-nginx-flask-mongo

      - name: "from-compose · prometheus-grafana"
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/awesome-compose/master/prometheus-grafana/compose.yaml \
            -o /tmp/prometheus-grafana.yaml
          mkdir -p /tmp/fc-prometheus-grafana
          uv run cutip from-compose /tmp/prometheus-grafana.yaml --output-dir /tmp/fc-prometheus-grafana
          uv run cutip validate --path /tmp/fc-prometheus-grafana

      - name: "from-compose · angular"
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/awesome-compose/master/angular/compose.yaml \
            -o /tmp/angular.yaml
          mkdir -p /tmp/fc-angular
          uv run cutip from-compose /tmp/angular.yaml --output-dir /tmp/fc-angular
          uv run cutip validate --path /tmp/fc-angular

  # ── E2E · Windows ───────────────────────────────────────────────────────────
  e2e-podman-windows:
    name: E2E Podman · Windows
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install cutip
        run: |
          uv venv .venv
          uv pip install -e .

      - name: Install Podman (Windows)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "token $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod "https://api.github.com/repos/containers/podman/releases/latest" -Headers $headers
          $version  = $release.tag_name.TrimStart('v')
          $url      = "https://github.com/containers/podman/releases/download/v${version}/podman-${version}-setup.exe"
          Write-Host "Downloading Podman $version from $url"
          Invoke-WebRequest -Uri $url -OutFile "podman-setup.exe"
          Start-Process -Wait -FilePath ".\podman-setup.exe" -ArgumentList "/S"
          $podmanPath = "C:\Program Files\RedHat\Podman"
          echo "$podmanPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CUTIP_BACKEND_NAME=podman" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$podmanPath\podman.exe" --version

      - name: Start Podman machine (Windows)
        shell: pwsh
        run: |
          podman machine init --cpus 2 --memory 2048 --now
          podman version

      - name: Validate simple workspace
        run: uv run cutip validate --path tests/e2e/simple

      - name: Run E2E group simple (Podman · Windows)
        run: uv run cutip run simple --path tests/e2e/simple --backend podman

      - name: Validate complex workspace
        run: uv run cutip validate --path tests/e2e/complex

      - name: Run E2E group complex (Podman · Windows)
        run: uv run cutip run complex --path tests/e2e/complex --backend podman

      # ── from-compose: awesome-compose validation suite ──────────────────────
      - name: "from-compose · react-nginx (Windows)"
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/docker/awesome-compose/master/react-nginx/compose.yaml" `
            -OutFile "$env:TEMP\react-nginx.yaml"
          New-Item -ItemType Directory -Force "$env:TEMP\fc-react-nginx" | Out-Null
          uv run cutip from-compose "$env:TEMP\react-nginx.yaml" --output-dir "$env:TEMP\fc-react-nginx"
          uv run cutip validate --path "$env:TEMP\fc-react-nginx"

      - name: "from-compose · fastapi (Windows)"
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/docker/awesome-compose/master/fastapi/compose.yaml" `
            -OutFile "$env:TEMP\fastapi.yaml"
          New-Item -ItemType Directory -Force "$env:TEMP\fc-fastapi" | Out-Null
          uv run cutip from-compose "$env:TEMP\fastapi.yaml" --output-dir "$env:TEMP\fc-fastapi"
          uv run cutip validate --path "$env:TEMP\fc-fastapi"

      - name: "from-compose · nginx-flask-mongo (Windows)"
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/docker/awesome-compose/master/nginx-flask-mongo/compose.yaml" `
            -OutFile "$env:TEMP\nginx-flask-mongo.yaml"
          New-Item -ItemType Directory -Force "$env:TEMP\fc-nginx-flask-mongo" | Out-Null
          uv run cutip from-compose "$env:TEMP\nginx-flask-mongo.yaml" --output-dir "$env:TEMP\fc-nginx-flask-mongo"
          uv run cutip validate --path "$env:TEMP\fc-nginx-flask-mongo"

      - name: "from-compose · prometheus-grafana (Windows)"
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/docker/awesome-compose/master/prometheus-grafana/compose.yaml" `
            -OutFile "$env:TEMP\prometheus-grafana.yaml"
          New-Item -ItemType Directory -Force "$env:TEMP\fc-prometheus-grafana" | Out-Null
          uv run cutip from-compose "$env:TEMP\prometheus-grafana.yaml" --output-dir "$env:TEMP\fc-prometheus-grafana"
          uv run cutip validate --path "$env:TEMP\fc-prometheus-grafana"

      - name: "from-compose · angular (Windows)"
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/docker/awesome-compose/master/angular/compose.yaml" `
            -OutFile "$env:TEMP\angular.yaml"
          New-Item -ItemType Directory -Force "$env:TEMP\fc-angular" | Out-Null
          uv run cutip from-compose "$env:TEMP\angular.yaml" --output-dir "$env:TEMP\fc-angular"
          uv run cutip validate --path "$env:TEMP\fc-angular"

  # ── Install & Validate · macOS ──────────────────────────────────────────────
  install-validate-macos:
    # GitHub Actions free macOS runners report VZErrorDomain Code=2
    # ("Virtualization is not available on this hardware") — the Apple
    # Hypervisor Framework is not exposed to runner processes, so podman machine
    # cannot start. Container runtime E2E is tested locally on a developer Mac
    # or via a self-hosted runner. This job validates install + schema only.
    name: Install & Validate · macOS
    runs-on: macos-14
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install cutip
        run: |
          uv venv .venv
          uv pip install -e .

      - name: Smoke-test CLI (no runtime needed)
        run: |
          uv run cutip --help
          uv run cutip --version

      - name: Validate simple workspace (schema only, no containers)
        run: uv run cutip validate --path tests/e2e/simple

      - name: Validate complex workspace (schema only, no containers)
        run: uv run cutip validate --path tests/e2e/complex

  # ── Docs Build ──────────────────────────────────────────────────────────────
  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install docs dependencies
        run: |
          uv venv .venv
          uv pip install -e ".[docs]"

      - name: Build docs (strict)
        run: uv run mkdocs build --strict

  # ── Build Wheel (push only — archives artifact) ─────────────────────────────
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build wheel
        run: uv build --wheel

      - name: List dist/
        run: ls -lh dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutip-wheel
          path: dist/*.whl
          retention-days: 7
