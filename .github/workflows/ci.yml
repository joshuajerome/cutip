name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - staging
      - integration

jobs:
  # ── Auto-label and assign on PR open ────────────────────────────────────────
  auto-label:
    name: Label & Assign PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'

    permissions:
      pull-requests: write

    steps:
      - name: Apply label and assignee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          BRANCH="${{ github.head_ref }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          # Assign to PR author
          gh pr edit "$PR" --repo "${{ github.repository }}" --add-assignee "$AUTHOR"

          # Derive label from branch prefix
          if echo "$BRANCH" | grep -qE '^feat/'; then
            LABEL="feature"
            COLOR="0075ca"
            DESC="New feature or capability"
          elif echo "$BRANCH" | grep -qE '^bug/'; then
            LABEL="bugfix"
            COLOR="d73a4a"
            DESC="Bug fix"
          elif echo "$BRANCH" | grep -qE '^docs/'; then
            LABEL="documentation"
            COLOR="006b75"
            DESC="Documentation update"
          elif echo "$BRANCH" | grep -qE '^(gh|claude)/'; then
            LABEL="automation"
            COLOR="e4e669"
            DESC="CI/CD or automation change"
          else
            LABEL="feature"
            COLOR="0075ca"
            DESC="New feature or capability"
          fi

          gh label create "$LABEL" --color "$COLOR" --description "$DESC" \
            --force --repo "${{ github.repository }}" 2>/dev/null || true
          gh pr edit "$PR" --repo "${{ github.repository }}" --add-label "$LABEL"

  # ── Ruff Lint ───────────────────────────────────────────────────────────────
  ruff-lint:
    name: Ruff Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

  # ── Ruff Format ────────────────────────────────────────────────────────────
  ruff-format:
    name: Ruff Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync

      - name: Ruff format check
        run: uv run ruff format --check .

  # ── Type Check ─────────────────────────────────────────────────────────────
  ty-check:
    name: Type Check (ty)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync

      - name: ty check
        run: uv run ty check

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/e2e -v --tb=short

  # ── Smoke Test ──────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke-test wheel install
        run: |
          uv venv .wheel-test --python 3.13
          uv pip install --python .wheel-test/bin/python dist/cutip-*.whl
          .wheel-test/bin/python -c "import cutip; print('cutip import OK')"
          .wheel-test/bin/cutip --help

  # ── Install & Validate · macOS ──────────────────────────────────────────────
  install-validate-macos:
    # GitHub Actions free macOS runners report VZErrorDomain Code=2
    # ("Virtualization is not available on this hardware") — the Apple
    # Hypervisor Framework is not exposed to runner processes, so podman machine
    # cannot start. Container runtime E2E is tested locally on a developer Mac
    # or via a self-hosted runner. This job validates install + schema only.
    name: Install & Validate · macOS
    runs-on: macos-14
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install cutip
        run: |
          uv venv .venv --python 3.13
          uv pip install -e .

      - name: Smoke-test CLI (no runtime needed)
        run: |
          uv run cutip --help
          uv run cutip --version

      - name: Validate cutip's own project YAML in tests/fixtures
        run: |
          # Smoke: ensure cutip can parse a real project YAML.
          uv run cutip --help

  # ── Docs Build ──────────────────────────────────────────────────────────────
  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install docs dependencies
        run: |
          uv venv .venv --python 3.13
          uv pip install -e ".[docs]"

      - name: Build docs (strict)
        run: uv run mkdocs build --strict


  # ── Rust Core Build ─────────────────────────────────────────────────────────
  rust-build:
    name: Rust Core Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and install
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pyyaml
          .venv/bin/maturin develop --features pyo3/extension-module

      - name: Test CLI commands
        run: |
          .venv/bin/python -m cutip --help
          .venv/bin/python -m cutip validate --path example/config.yaml
          .venv/bin/python -m cutip tree --path example/config.yaml
          .venv/bin/python -m cutip doctor
          .venv/bin/python -m cutip validate --json --path example/config.yaml
