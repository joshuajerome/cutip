name: Docs Generate

on:
  push:
    branches:
      - staging

jobs:
  detect-and-generate:
    name: Detect feat/bug merge · Generate docs
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect source branch type
        id: detect
        run: |
          # The merge commit message contains "Merge pull request ... from <branch>"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Extract source branch from merge commit
          SOURCE_BRANCH=$(echo "$COMMIT_MSG" | grep -oP '(?<=from )\S+' || true)
          echo "Source branch: $SOURCE_BRANCH"

          if echo "$SOURCE_BRANCH" | grep -qE '^(feat|bug)/'; then
            echo "is_feat_or_bug=true" >> "$GITHUB_OUTPUT"
            # Extract cap ID (e.g. cap001) from branch name
            CAP_ID=$(echo "$SOURCE_BRANCH" | grep -oP 'cap\d+' || echo "")
            echo "cap_id=$CAP_ID" >> "$GITHUB_OUTPUT"
            echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "is_feat_or_bug=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.detect.outputs.is_feat_or_bug == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install script dependencies
        if: steps.detect.outputs.is_feat_or_bug == 'true'
        run: |
          uv venv .venv
          uv pip install anthropic

      - name: Generate docs via Claude API
        if: steps.detect.outputs.is_feat_or_bug == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAP_ID: ${{ steps.detect.outputs.cap_id }}
          SOURCE_BRANCH: ${{ steps.detect.outputs.source_branch }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          uv run python .github/scripts/generate-docs.py

      - name: Create docs branch and open PR
        if: steps.detect.outputs.is_feat_or_bug == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAP_ID: ${{ steps.detect.outputs.cap_id }}
          SOURCE_BRANCH: ${{ steps.detect.outputs.source_branch }}
        run: |
          CAP_SLUG=$(echo "$SOURCE_BRANCH" | sed 's|.*/||')
          DOCS_BRANCH="docs/${CAP_SLUG}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$DOCS_BRANCH"
          git add docs/capabilities.md docs/patch-notes.md
          git diff --staged --quiet || git commit -m "[${CAP_ID}] Auto-generate docs for ${SOURCE_BRANCH}"
          git push origin "$DOCS_BRANCH"

          gh pr create \
            --base staging \
            --head "$DOCS_BRANCH" \
            --title "[${CAP_ID}] Auto-generated docs" \
            --body "Auto-generated patch notes and capability registry entry for \`${SOURCE_BRANCH}\`." \
            --label "docs-auto" || true
