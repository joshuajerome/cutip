name: Docs

on:
  pull_request:
    branches:
      - staging
      - integration
    paths:
      - "docs/**"
      - "mkdocs.yml"

jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: MkDocs · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install docs dependencies
        run: |
          uv venv .venv
          uv pip install -e ".[docs]"

      - name: Build docs (strict — fails on any warning)
        run: uv run mkdocs build --strict
