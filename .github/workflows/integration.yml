name: Integration

on:
  pull_request:
    types: [closed]
    branches:
      - integration

jobs:
  # NOTE: Test PyPI publish removed. `uv build --wheel` for a maturin/PyO3
  # project without Rust produces a generic linux_x86_64-tagged wheel that
  # PyPI rejects. release.yml's build-wheels matrix produces proper
  # manylinux wheels — that's the source of truth. If we want a Test PyPI
  # dev publish back, it needs Rust install + maturin build.

  # ── Prune branches merged into integration ───────────────────────────────────
  prune:
    name: Delete merged branches
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prune merged remote branches
        run: |
          git fetch --prune origin

          # Branches fully merged into integration, excluding permanent branches
          # release/* branches are kept permanently as historical references
          MERGED=$(git branch -r --merged origin/integration \
            | grep -vE 'origin/(integration|staging|HEAD|release/.+|gh-pages)' \
            | sed 's|^\s*origin/||' \
            | xargs)

          if [ -z "$MERGED" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          echo "Pruning: $MERGED"
          for branch in $MERGED; do
            git push origin --delete "$branch" && echo "  Deleted: $branch"
          done
