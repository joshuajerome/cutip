name: Integration

on:
  pull_request:
    types: [closed]
    branches:
      - integration

jobs:
  # ── Publish dev build to Test PyPI ──────────────────────────────────────────
  publish-dev:
    name: Publish dev build to Test PyPI
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Compute dev version and patch pyproject.toml
        run: |
          CURRENT=$(python -c "import re; m=re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M); print(m.group(1))")
          IFS='.' read -r MAJ MIN PATCH <<< "$CURRENT"
          DEV_VERSION="${MAJ}.${MIN}.$((PATCH+1)).dev${GITHUB_RUN_NUMBER}"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"
          sed -i "s/^version = \"${CURRENT}\"/version = \"${DEV_VERSION}\"/" pyproject.toml
          echo "Patched version: $DEV_VERSION"

      - name: Build wheel
        run: uv build --wheel

      - name: Publish to Test PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          uv publish --publish-url https://test.pypi.org/legacy/
          echo ""
          echo "Install with:"
          echo "  pip install --index-url https://test.pypi.org/simple/ \\"
          echo "    --extra-index-url https://pypi.org/simple/ \\"
          echo "    \"cutip>=${DEV_VERSION}\""

  # ── Prune branches merged into integration ───────────────────────────────────
  prune:
    name: Delete merged branches
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prune merged remote branches
        run: |
          git fetch --prune origin

          # Branches fully merged into integration, excluding permanent branches
          # release/* branches are kept permanently as historical references
          MERGED=$(git branch -r --merged origin/integration \
            | grep -vE 'origin/(integration|staging|HEAD|release/.+|gh-pages)' \
            | sed 's|^\s*origin/||' \
            | xargs)

          if [ -z "$MERGED" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          echo "Pruning: $MERGED"
          for branch in $MERGED; do
            git push origin --delete "$branch" && echo "  Deleted: $branch"
          done
