name: Prune Merged Branches

on:
  push:
    branches:
      - integration

jobs:
  prune:
    name: Delete branches merged into integration
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prune merged remote branches
        run: |
          git fetch --prune origin

          # Branches fully merged into integration, excluding permanent branches
          MERGED=$(git branch -r --merged origin/integration \
            | grep -vE 'origin/(integration|staging|HEAD)' \
            | sed 's|^\s*origin/||' \
            | xargs)

          if [ -z "$MERGED" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          echo "Pruning: $MERGED"
          for branch in $MERGED; do
            git push origin --delete "$branch" && echo "  Deleted: $branch"
          done
