[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "cutip"
version = "1.0.0"
description = "Workflow automation framework — define infrastructure as YAML, automate with Python, execute in containers"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joshua Jerome" }]
keywords = ["containers", "workflow", "automation", "devops", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/joshuajerome/cutip"
Repository = "https://github.com/joshuajerome/cutip"
Documentation = "https://joshuajerome.github.io/cutip"

[tool.maturin]
# Build as a standalone binary, not a Python extension
bindings = "bin"
