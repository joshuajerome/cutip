site_name: CUTIP
site_description: >
  Workflow automation framework — define infrastructure as YAML,
  automate with Python, execute in containers.
site_url: https://joshuajerome.github.io/cutip
repo_url: https://github.com/joshuajerome/cutip
repo_name: joshuajerome/cutip
edit_uri: edit/integration/docs/

docs_dir: docs

extra_css:
  - stylesheets/cutip.css

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
  features:
    - navigation.tabs           # top sections render as header tabs
    - navigation.sections       # subsections shown as groups in the sidebar
    - navigation.expand         # expand all sections by default
    - navigation.top            # back-to-top button
    - toc.follow                # TOC follows scroll position
    - search.suggest            # search autocomplete
    - search.highlight          # highlight terms in search results
    - content.code.copy         # copy button on all code blocks
    - content.code.annotate     # inline code annotations
    - content.action.edit       # "Edit this page" link (uses edit_uri above)

plugins:
  - search
  - callouts   # converts > [!NOTE] / > [!TIP] / > [!IMPORTANT] → Material admonitions

markdown_extensions:
  # Code highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite

  # File inclusion — lets docs/index.md pull in root README.md
  - pymdownx.snippets:
      base_path: ["."]         # search from repo root, so --8<-- "README.md" works

  # Fenced code blocks (must come after highlight)
  - pymdownx.superfences

  # Collapsible details / admonitions
  - admonition
  - pymdownx.details

  # Tables, task lists, footnotes
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true

  # TOC with permalink anchors
  - toc:
      permalink: true
      title: On this page

# ── Navigation ──────────────────────────────────────────────────────────────
# Paths are relative to docs_dir (docs/).
nav:
  - Home: index.md

  - Getting Started:
    - Installation: getting-started/installation.md
    - Why CUTIP?: getting-started/why-cutip.md
    - Quickstart: getting-started/quickstart.md
    - Workspace Layout: getting-started/workspace-layout.md

  - Concepts:
    - Overview: concepts/overview.md
    - Cards: concepts/cards.md
    - Units: concepts/units.md
    - Groups: concepts/groups.md
    - Lifecycle: concepts/lifecycle.md
    - Annotations: concepts/annotations.md
    - Graph Resolution: concepts/graph-resolution.md

  - Reference:
    - CLI: reference/cli.md
    - Compile: reference/compile.md
    - Workflow Contract: reference/workflow-contract.md
    - Exceptions: reference/exceptions.md
    - Design Tokens: reference/themes.md
    - Cards:
      - ImageCard: reference/cards/image-card.md
      - ContainerCard: reference/cards/container-card.md
      - NetworkCard: reference/cards/network-card.md

  - Guides:
    - Use Cases: guides/use-cases.md
    - Runtimes:
      - Podman: guides/runtimes/podman.md
      - Docker: guides/runtimes/docker.md
    - Workflows:
      - Writing Workflows: guides/workflows/writing-workflows.md
      - Plan-Safe Workflows: guides/workflows/plan-safe.md
    - CI/CD:
      - GitHub Actions: guides/ci-cd/github-actions.md

  - Architecture:
    - Design Decisions: architecture/design-decisions.md
    - Backend Interface: architecture/backend-interface.md

  - Automation:
    - Overview: automation/index.md
    - Feature / Fix Pipeline: automation/feature-fix-pipeline.md
    - Documentation Pipeline: automation/documentation-pipeline.md
    - Release Pipeline: automation/release-pipeline.md

  - Development:
    - Branching Guide: development/branching.md
    - CI/CD Workflows: development/workflows.md
    - Repository Setup: development/repo-setup.md
    - Capabilities: capabilities.md
    - Patch Notes: patch-notes.md
