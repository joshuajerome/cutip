apiVersion: cutip/v1
kind: ContainerCard
metadata:
  name: cutip-db
spec:
  imageRef:
    ref: images/db
  networkRef:
    ref: networks/app-net
  environment:
    POSTGRES_DB: appdb
    POSTGRES_USER: appuser
    POSTGRES_PASSWORD: "{{ vars.db_password }}"
  volumes:
    db_data: /var/lib/postgresql/data
  labels:
    app: cutip-complex-e2e
    role: database
