apiVersion: cutip/v1
kind: ContainerCard
metadata:
  name: cutip-hello
spec:
  imageRef:
    ref: images/hello
  # Use the default bridge — no managed NetworkCard needed
  network_mode: bridge
  # Print a sentinel string then exit cleanly
  command: 'sh -c "echo CUTIP_OK && echo backend=$CUTIP_BACKEND"'
  environment:
    CUTIP_BACKEND: "unknown"   # overridden by workflow.py at runtime
