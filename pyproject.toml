[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cutip"
version = "0.1.8"
description = "Container Unit Templates in Python — a deterministic framework for building container workloads"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Joshua Jerome" },
]
keywords = ["containers", "podman", "docker", "devops", "workflow", "infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "rich>=13.0",
    "podman>=4.0",
    "docker>=6.0",
]

[project.urls]
Homepage = "https://github.com/joshuajerome/cutip"
Documentation = "https://joshuajerome.github.io/cutip"
Repository = "https://github.com/joshuajerome/cutip"
"Bug Tracker" = "https://github.com/joshuajerome/cutip/issues"

[project.scripts]
cutip = "cutip.cli.main:app"

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs<2.0",              # MkDocs 2.0 is incompatible with mkdocs-material (Feb 2026)
    "mkdocs-callouts>=1.14",   # converts > [!NOTE] GitHub callouts → Material admonitions
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
