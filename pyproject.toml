[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "cutip"
version = "2.8.0"
description = "Workflow automation framework — define infrastructure as YAML, automate with Python, execute in containers"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Joshua Jerome" },
]
keywords = ["containers", "podman", "docker", "devops", "workflow", "automation", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/joshuajerome/cutip"
Documentation = "https://joshuajerome.github.io/cutip"
Repository = "https://github.com/joshuajerome/cutip"

[project.scripts]
cutip = "cutip.cli:main"

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs<2.0",
    "mkdocs-callouts>=1.14",
]

[dependency-groups]
dev = [
    "maturin>=1.0",
    "pytest>=9.0",
    "pytest-cov>=7.1.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "cutip._core"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=cutip --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
source = ["cutip"]
omit = [
    "cutip/__main__.py",
    "cutip/cli.py",           # tested via subprocess integration (test_cli.py)
    "cutip/workflow/commands.py",  # AST utility, low-priority coverage
    "cutip/daemon.py",        # tested via integration (cutip run --bg)
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
]
